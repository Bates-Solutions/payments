# Builds the combined API docs site (scripts/build-site.mjs) and deploys it to
# GitHub Pages: https://bates-solutions.github.io/payments/<package>/
#
# Pull requests build the site only; a push to main (or a manual run from main)
# also deploys. What gates a merge is ci.yml, which runs typedoc for every
# affected package (this workflow is path-filtered, so it cannot be required).
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub
# Actions". The first deploy creates the github-pages environment.
name: Docs

on:
  # Keep the two path lists the same.
  pull_request:
    paths:
      - 'packages/*/src/**'
      - 'packages/*/typedoc.json'
      - 'packages/*/jsr.json'
      - 'packages/*/package.json'
      - 'packages/*/tsconfig.json'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.mjs'
      - 'scripts/affected-packages.mjs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'packages/*/src/**'
      - 'packages/*/typedoc.json'
      - 'packages/*/jsr.json'
      - 'packages/*/package.json'
      - 'packages/*/tsconfig.json'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-site.mjs'
      - 'scripts/affected-packages.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR builds cancel older runs of the same PR. Other runs are grouped per ref,
  # so main's deploys queue behind each other and are never cancelled in
  # progress, and a manual run from another ref cannot displace a pending main
  # deploy.
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run docs:site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
