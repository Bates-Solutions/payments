# Releases with release-please (manifest mode, release-please-config.json), then
# publishes each released package to JSR over GitHub OIDC (no tokens), with
# provenance. Runs on GitHub-hosted runners only.
#
# Flow: conventional commits land on main. release-please keeps one release PR open
# that bumps each changed package's package.json, jsr.json and CHANGELOG.md.
# Merging it (with a merge commit) tags each package `<pkg>-v<version>` at the merge
# commit and creates its GitHub release. `verify` then checks each released
# package, and `publish` pushes it to JSR, payments-core first.
# scripts/release-plan.mjs decides what to publish: it skips versions JSR already
# has (so a rerun never republishes) and, with --require-tags, fails unless each
# package's tag points at the commit being published. JSR versions are immutable,
# so a version is only ever published from the exact commit it was tagged at.
#
# Off until cutover: every job is skipped unless the repository variable
# RELEASES_ENABLED is 'true'. Until then the old repos release these packages, and
# release PRs, tags and GitHub releases made here would diverge from their
# versions. (Publishing from here can't happen before cutover anyway: JSR only
# accepts OIDC publishes from the package's linked repo.) Cutover order:
#   1. the last release from each old repo, then a re-import (with its tags) here;
#   2. relink each JSR package to Bates-Solutions/payments (jsr.io, package
#      Settings, "GitHub repository"), which stops the old repos publishing, and
#      set RELEASES_ENABLED to 'true' at the same time;
#   3. add a RELEASE_PLEASE_TOKEN secret (a GitHub App token or fine-grained PAT
#      with contents and pull-requests write) before then. A release PR opened with
#      the default GITHUB_TOKEN gets no CI run, so ci-ok never reports and the PR
#      can't merge.
#   Optionally limit the `jsr` environment to main and tags (repo Settings,
#   Environments) as a second gate on publishing.
#
# Recovery: if a publish fails after the tag was created, run this workflow by hand
# (workflow_dispatch) from the tag, e.g. `gh workflow run release.yml --ref
# clover-v1.1.1`. It then publishes every package whose version at that commit is
# tagged there and missing from JSR. A fix for the failure itself ships as the
# next release, never under the already-tagged version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time and never cancelled mid-run. A newer run can still replace
# one that is waiting in the queue; the replaced run's release is then created by
# the newer run, whose tag check fails (the tag is not at its commit) instead of
# publishing the wrong code. Recover by dispatching from the tag, as above.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Tags and GitHub releases for a merged release PR. Kept apart from the release
  # PR update below: a failure there must not stop the publish of releases that
  # were already tagged (the merged PR is relabelled `autorelease: tagged`, so no
  # later push would pick them up again).
  release-please:
    name: release-please
    if: vars.RELEASES_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      pull-requests: write # relabels the merged release PR
    outputs:
      paths: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Opens or updates the release PR. After the tagging job, because release-please
  # won't build a new release PR while a merged one is still untagged.
  release-pr:
    name: release PR
    needs: release-please
    if: vars.RELEASES_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR branch
      pull-requests: write # the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # The install with lifecycle scripts and the checks (eslint, tsc, vitest) run
  # here, without id-token: write.
  verify:
    name: Verify releases
    needs: release-please
    if: >-
      !cancelled() && vars.RELEASES_ENABLED == 'true' &&
      ((github.event_name == 'push' && needs.release-please.result == 'success' &&
        needs.release-please.outputs.paths != '' && needs.release-please.outputs.paths != '[]') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, for --require-tags
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Every package, not only paths_released (which is just the trigger): if a
      # multi-package release PR's tagging failed partway and "re-run failed
      # jobs" finished it, paths_released lists only the packages tagged on the
      # rerun, and the ones tagged first would never be published. Each version
      # still missing from JSR must be tagged at HEAD, or the run fails.
      - name: Work out what to publish
        id: plan
        run: |
          plan="$(node scripts/release-plan.mjs --all --require-tags)"
          echo "Publish plan: $plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.plan.outputs.plan != '[]'
        run: npm ci

      - name: Lint, typecheck, build and test
        if: steps.plan.outputs.plan != '[]'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          for pkg in $(echo "$PLAN" | jq -r '.[].package'); do
            echo "::group::$pkg"
            npm run lint -w "packages/$pkg"
            npm run typecheck -w "packages/$pkg"
            npm run build -w "packages/$pkg"
            npm test -w "packages/$pkg"
            echo "::endgroup::"
          done

  # Holds the OIDC token, so it runs as little third-party code as it can: the
  # pinned jsr CLI, the repo's own release-plan script (node: built-ins only), and
  # an install with lifecycle scripts off (jsr publish reads the packages' npm
  # dependencies from node_modules; no lint, build or test runs here).
  publish:
    name: Publish to JSR
    needs: verify
    # !cancelled(), not always(): a run cancelled after verify must not publish.
    # (The bare success() default would skip this job on manual runs, where
    # release-please, a needs-of-needs, is skipped.)
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.plan != '[]'
    runs-on: ubuntu-latest
    environment: jsr
    permissions:
      contents: read
      id-token: write # OIDC auth to JSR, and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      # In plan order (payments-core first), so a provider is never published
      # before the core version it imports. The plan is worked out again here so a
      # rerun of this job alone skips what already went out.
      - name: Publish
        env:
          PLAN: ${{ needs.verify.outputs.plan }}
        run: |
          paths="$(echo "$PLAN" | jq -c '[.[] | "packages/" + .package]')"
          plan="$(node scripts/release-plan.mjs --paths "$paths" --require-tags)"
          for pkg in $(echo "$plan" | jq -r '.[].package'); do
            name="$(jq -r .name "packages/$pkg/jsr.json")"
            version="$(jq -r .version "packages/$pkg/jsr.json")"
            echo "::group::$name@$version"
            (cd "packages/$pkg" && npx --yes jsr@0.14.3 publish)
            echo "::endgroup::"
            echo "::notice::Published $name@$version to JSR."
          done
